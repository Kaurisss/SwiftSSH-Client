<style>

  --secondary: #b0b0b8; --border: #82828c; --separator: #39393e; --accent: #59d9d9;

}

.app-nav button { border: 0; background: transparent; color: var(--accent); min-height: 44px; padding: 4px; }
.app-nav .nav-icon { justify-self: end; width: 44px; display: grid; place-items: center; }
.screen-content { padding: 0 20px 24px; flex: 1; min-width: 0; }
h2, h3, p { margin-block-start: 0; }
.hero { margin: 12px 0 24px; }

.hero h2 { font-size: 26px; line-height: 1.25; letter-spacing: -.6px; margin-block-end: 8px; font-weight: 700; }

.stack { display: flex; flex-direction: column; gap: 24px; }
.field { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.field > label, .section-label { font-size: 12px; font-weight: 550; color: var(--secondary); margin: 0; padding-inline: 4px; }
.phone input, .phone textarea { width: 100%; min-width: 0; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 14px; font-size: 16px; }
.phone textarea { min-height: 170px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 16px; line-height: 1.8; overflow-wrap: anywhere; white-space: pre-wrap; }
.phone input::placeholder, .phone textarea::placeholder { color: var(--secondary); opacity: 1; }
.phone input[aria-invalid="true"], .phone textarea[aria-invalid="true"] { border: 2px solid var(--error); }
.inline-error { color: var(--error); font-size: 13px; margin: 0; }
.primary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; padding: 14px 16px; background: var(--accent-fill); color: var(--on-accent); border: 0; border-radius: 999px; font-size: 16px; font-weight: 600; }
.primary svg { width: 20px; height: 20px; }
.primary:disabled { background: var(--elevated); color: var(--secondary); }
.action-area { margin-block-start: 28px; display: flex; flex-direction: column; gap: 12px; }
.privacy { display: flex; align-items: flex-start; justify-content: center; gap: 6px; color: var(--secondary); font-size: 11px; text-align: center; margin: 0; }

.panel { background: var(--surface); border-radius: 18px; padding: 16px; }
.key-heading { display: flex; gap: 12px; align-items: flex-start; }
.key-heading > svg { color: var(--accent); margin-block-start: 2px; }

.badge svg { width: 14px; height: 14px; }
.fingerprint { margin: 16px 0 0; padding-block-start: 12px; border-block-start: 1px solid var(--separator); }
.fingerprint summary { cursor: pointer; font-size: 12px; color: var(--secondary); padding-block: 4px; }
.fingerprint code { display: block; font-size: 11px; overflow-wrap: anywhere; margin-block-start: 8px; color: var(--secondary); }
.source-list { display: flex; flex-direction: column; gap: 12px; }
.source-card { display: flex; align-items: center; width: 100%; gap: 14px; padding: 18px 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: 18px; text-align: start; min-height: 92px; }
.source-card > .source-icon { width: 42px; height: 42px; padding: 10px; color: var(--accent); background: var(--accent-soft); border-radius: 12px; }
.source-card .source-copy { min-width: 0; flex: 1; }
.source-card strong { display: block; font-size: 16px; font-weight: 600; margin-block-end: 3px; }
.source-card small { display: block; color: var(--secondary); font-size: 12px; }
.source-card > .chevron { width: 16px; height: 16px; color: var(--secondary); }
.source-card[aria-pressed="true"] { border-color: var(--accent); border-width: 2px; padding: 17px 15px; }
.back-link { align-self: center; min-height: 44px; padding: 8px 16px; background: transparent; color: var(--accent); border: 0; text-decoration: underline; text-underline-offset: 4px; }
.support-note { padding: 16px 4px 0; color: var(--secondary); font-size: 12px; line-height: 1.7; }
.import-result { padding-block: 38px 24px; }
.import-result .key-emblem { margin-inline: auto; }
.import-result h2, .import-result > p { text-align: center; }
.manager-title { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin: 12px 0 24px; }
.manager-title h2 { margin: 0; font-size: 28px; }
.manager-title button { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); color: var(--accent); background: var(--surface); }
.manager-keys { display: flex; flex-direction: column; gap: 12px; list-style: none; margin: 0; padding: 0; }
.manager-keys li { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--surface); border-radius: 16px; }
.manager-keys li > svg { color: var(--accent); }
.manager-keys strong { display: block; font-size: 15px; overflow-wrap: anywhere; }
.manager-keys small { display: block; font-size: 12px; color: var(--secondary); }
.tab-bar { display: flex; justify-content: space-around; gap: 8px; margin: 48px 0 12px; padding: 12px; background: var(--surface); border-radius: 999px; }
.tab-bar span { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: var(--secondary); }
.tab-bar [aria-current="page"] { color: var(--accent); font-weight: 650; }
.home-indicator { width: 120px; height: 5px; border-radius: 3px; background: var(--text); margin: 16px auto 10px; }
.live-message { max-width: 402px; margin: 12px auto 0; color: #444951; font-size: 12px; min-height: 20px; }
@media (max-width: 420px) { .workbench-header { padding: 16px 12px 4px; } .workbench-note { padding-inline: 12px; } .workbench-brand span { font-size: 12px; } .phone { border-radius: 24px; } .screen-content { padding-inline: 16px; } }
@media (forced-colors: active) { button, input, textarea, select { border: 1px solid ButtonText !important; } :focus-visible { outline: 3px solid Highlight !important; } }
</style>

<header class="workbench-header">
  <div class="workbench-brand"><strong>SwiftSSH</strong><span>SSH 密钥导入 · 来源优先</span></div>
  <div class="workbench-tools"><label for="theme">外观</label><select id="theme"><option value="light">浅色</option><option value="dark">深色</option><option value="system">跟随系统</option></select></div>
</header>
<p class="workbench-note">交互原型 · 仅载入示例，不读取文件或剪贴板，不保存或上传密钥。请勿输入真实私钥。</p>
<main class="preview-wrap" id="preview" tabindex="-1">

  <div class="phone" id="phone" data-theme="light">
    <div class="status-bar" aria-hidden="true"><span>9:41</span><span class="status-icons"><svg><use href="#wifi"/></svg><svg><use href="#battery"/></svg></span></div>
    <div class="app-context"><strong>SSH 密钥</strong><span id="key-count">3 把示例密钥</span></div>
    <section class="sheet" aria-label="密钥导入预览">
      <div class="handle" aria-hidden="true"></div>
      <div class="app-nav"><button type="button" id="cancel">取消</button><h1>导入 SSH 密钥</h1><button type="button" class="nav-icon" id="help-button" aria-label="导入帮助" aria-expanded="false"><svg aria-hidden="true"><use href="#help"/></svg></button></div>

<script>
'use strict';
const SAMPLE = '-----BEGIN OPENSSH PRIVATE KEY-----\nSWIFTSSH_PREVIEW_ONLY_NOT_A_VALID_KEY\n-----END OPENSSH PRIVATE KEY-----';
const fingerprint = 'SHA256:Qm8F5yNb2tH7vLk9sP4cR6jD1wA0eX3uZ8gB5nK2oY4';
const state = { label: '生产环境 · 运维', pem: '', source: '', view: 'import', imported: false, help: false };
const screen = document.getElementById('screen');
const escapeHTML = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon = name => `<svg aria-hidden="true"><use href="#${name}"/></svg>`;
function announce(message) { document.getElementById('announcement').textContent = message; }
function hero(title, description) { return `<div class="hero"><div class="key-emblem">${icon('key')}</div><h2 tabindex="-1" id="screen-title">${title}</h2><p>${description}</p></div>`; }
function nameField() { return `<div class="field"><label for="key-name">密钥名称</label><input id="key-name" name="key-name" autocomplete="off" maxlength="80" value="${escapeHTML(state.label)}" placeholder="例如：生产环境 · 运维" aria-describedby="name-error"><p class="inline-error" id="name-error" hidden></p></div>`; }
function keyEditor() { return `<div class="field"><label for="private-key">私钥内容</label><textarea id="private-key" name="private-key" autocomplete="off" autocapitalize="off" spellcheck="false" aria-describedby="key-hint key-error">${escapeHTML(state.pem)}</textarea><p class="hint" id="key-hint">已载入演示文本；请勿输入真实私钥。</p><p class="inline-error" id="key-error" hidden></p></div>`; }
function sources() { return `<div class="source-list"><button type="button" class="source-card" data-source="file" aria-pressed="${state.source === 'file'}"><svg class="source-icon" aria-hidden="true"><use href="#file"/></svg><span class="source-copy"><strong>从文件导入</strong><small>选择 id_ed25519、.pem 等私钥文件</small></span><svg class="chevron" aria-hidden="true"><use href="#${state.source === 'file' ? 'check' : 'arrow'}"/></svg></button><button type="button" class="source-card" data-source="paste" aria-pressed="${state.source === 'paste'}"><svg class="source-icon" aria-hidden="true"><use href="#paste"/></svg><span class="source-copy"><strong>粘贴私钥内容</strong><small>使用已复制的 OpenSSH / PEM 文本</small></span><svg class="chevron" aria-hidden="true"><use href="#${state.source === 'paste' ? 'check' : 'arrow'}"/></svg></button></div>`; }
function keyCard() { return `<section class="panel" aria-label="示例密钥预览"><div class="key-heading">${icon('key')}<div><h3>id_ed25519_production</h3><p>Ed25519 · OpenSSH · 示例</p><span class="badge">${icon('check')}未加密 · 可导入</span></div></div><details class="fingerprint"><summary>查看完整示例指纹</summary><code>${fingerprint}</code></details></section>`; }
function privacy() { return `<p class="privacy">${icon('shield')}<span>App 内私钥仅存于本机钥匙串<br>此网页仅演示，不写入钥匙串</span></p>`; }
function helpNote() { return state.help ? '<section class="panel" id="import-help"><h3>导入前须知</h3><p class="hint">App 暂不支持口令加密的私钥，请从 SSH 工具导出未加密的私钥后重试。此网页中的文件、粘贴和导入按钮只演示示例数据。</p></section>' : ''; }
function renderImport() { return hero('选择导入方式', '从一个文件开始，或者直接粘贴私钥。') + `<div class="stack">${sources()}${state.source ? `<form class="stack" novalidate><div class="field"><p class="section-label">${state.source === 'file' ? '已选择示例文件' : '已载入示例文本'}</p>${state.source === 'file' ? keyCard() : keyEditor()}</div>${nameField()}${helpNote()}<div class="action-area"><button class="primary" type="submit">${icon('shield')}导入到此设备</button>${privacy()}</div></form>` : `<p class="support-note">选择后会展开密钥预览和命名。支持 OpenSSH / PEM，口令加密的私钥暂不支持。</p>${helpNote()}${privacy()}`}</div>`; }
function renderSuccess() { return `<div class="import-result">${hero('导入预览完成', '示例密钥已出现在下方列表中。没有保存真实私钥，也没有写入系统钥匙串。')}<div class="stack">${keyCard()}<button type="button" class="primary" data-action="manager">查看密钥列表</button><button type="button" class="back-link" data-action="reset">重新体验导入</button></div></div>`; }
function renderManager() { const keys = [...(state.imported ? [[state.label, 'Ed25519 · 刚刚导入（演示）']] : []), ['运维主密钥', 'Ed25519 · OpenSSH'], ['家用 NAS', 'RSA 4096 · PEM'], ['CI 构建', 'Ed25519 · OpenSSH']]; return `<div class="manager-title"><h2 tabindex="-1" id="screen-title">SSH 密钥</h2><button type="button" data-action="reset" aria-label="再次导入密钥">${icon('plus')}</button></div><ul class="manager-keys">${keys.map(([name,type]) => `<li>${icon('key')}<div><strong>${escapeHTML(name)}</strong><small>${type}</small></div></li>`).join('')}</ul><div class="action-area"><button type="button" class="primary" data-action="reset">导入已有密钥</button></div><div class="tab-bar" aria-label="示例 App 栏（静态背景）"><span>${icon('server')}主机</span><span>${icon('terminal')}终端</span><span aria-current="page">${icon('key')}密钥</span><span>${icon('settings')}设置</span></div>`; }
function render(focusId) {
  document.getElementById('help-button').setAttribute('aria-expanded',String(state.help));
  screen.innerHTML = state.view === 'manager' ? renderManager() : state.view === 'success' ? renderSuccess() : renderImport();
  document.querySelector('.app-nav h1').textContent = state.view === 'manager' ? 'SSH 密钥' : '导入 SSH 密钥';
  document.getElementById('cancel').hidden = state.view === 'manager';
  document.getElementById('help-button').hidden = state.view !== 'import';
  document.getElementById('key-count').textContent = `${state.imported ? 4 : 3} 把示例密钥`;
  if (focusId) document.getElementById(focusId)?.focus();
}
function error(id,message) {
  const control = document.getElementById(id);
  const errorElement = document.getElementById(id === 'key-name' ? 'name-error' : 'key-error');
  control.setAttribute('aria-invalid','true');
  errorElement.textContent = message;
  errorElement.hidden = false;
  announce(message);
  control.focus();
}
screen.addEventListener('input',event => {
  if (event.target.id === 'key-name') state.label = event.target.value;
  if (event.target.id === 'private-key') state.pem = event.target.value;
  if (event.target.hasAttribute('aria-invalid')) {
    event.target.removeAttribute('aria-invalid');
    document.getElementById(event.target.id === 'key-name' ? 'name-error' : 'key-error').hidden = true;
  }
});
screen.addEventListener('click',event => {
  const source = event.target.closest('[data-source]');
  if (source) {
    state.source = source.dataset.source;
    state.pem = SAMPLE;
    render('key-name');
    announce('已载入示例密钥；没有读取文件或剪贴板。');
    return;
  }
  const action = event.target.closest('[data-action]')?.dataset.action;
  if (action === 'manager') { state.view = 'manager'; render('screen-title'); }
  if (action === 'reset') { Object.assign(state,{pem:'',source:'',view:'import',help:false}); render('screen-title'); announce('已重置示例导入流程。'); }
});
screen.addEventListener('submit',event => {
  event.preventDefault();
  if (!state.label.trim()) { error('key-name','请输入一个名称，例如“生产环境 · 运维”。'); return; }
  if (state.pem !== SAMPLE) { error('private-key','请重新点击“粘贴私钥内容”载入示例。此原型不接收真实私钥。'); return; }
  state.imported = true;
  state.view = 'success';
  render('screen-title');
  announce('导入预览完成。示例仅在当前页面内存中存在。');
});
document.getElementById('cancel').addEventListener('click',() => { state.view = 'manager'; state.pem = ''; render('screen-title'); announce('已取消导入，未保存任何密钥内容。'); });
document.getElementById('help-button').addEventListener('click',() => {
  state.help = !state.help;
  render();
  if (state.help) document.getElementById('import-help')?.scrollIntoView({block:'nearest'});
  announce(state.help ? 'App 暂不支持口令加密的私钥，请使用未加密的私钥重试。网页仅演示示例数据。' : '已收起导入帮助。');
});
const systemTheme = matchMedia('(prefers-color-scheme: dark)');
function updateTheme() {
  const theme = document.getElementById('theme').value;
  document.getElementById('phone').dataset.theme = theme === 'system' ? (systemTheme.matches ? 'dark' : 'light') : theme;
}
document.getElementById('theme').addEventListener('change',updateTheme);
systemTheme.addEventListener('change',updateTheme);
render();
</script>
</body>
</html>
