name: SwiftSSH
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.0"
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
    SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: false

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: "1.13.0"
  Citadel:
    path: Vendor/Citadel

  Runestone:
    url: https://github.com/simonbs/Runestone
    exactVersion: "0.5.2"
  TreeSitterLanguages:
    url: https://github.com/simonbs/TreeSitterLanguages
    exactVersion: "0.1.10"

targets:
  SwiftSSH:
    type: application
    platform: iOS
    sources:
      - path: mssh
        excludes:
          - Info-macOS.plist
          - mssh-mac.entitlements
          - mssh.xcconfig
          - Simulator.entitlements
          - Configuration.storekit
          - Services/AutoImportService.swift
          - Services/ConnectionSyncBridge.swift
          - Services/iCloudSyncService.swift
          - Services/SSHFolderImporter.swift
          - Services/TipJarService.swift
          - Services/PortForwardManager.swift
          - Views/MacContentView.swift
          - Views/MacSetupGuideView.swift
          - Views/SyncStatusView.swift
          - Views/TipJarView.swift
          - Views/PortForwardEditorView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.swiftssh
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "2"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": mssh/Simulator.entitlements
    dependencies:
      - package: SwiftTerm
      - package: Citadel
      - package: Runestone
        product: Runestone
      - package: TreeSitterLanguages
        product: TreeSitterBashRunestone
      - package: TreeSitterLanguages
        product: TreeSitterJSONRunestone
      - package: TreeSitterLanguages
        product: TreeSitterYAMLRunestone
    info:
      path: mssh/Info.plist
      properties:
        CFBundleDisplayName: SwiftSSH
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleLocalizations:
          - en
          - zh-Hans
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiresFullScreen: false
        NSFaceIDUsageDescription: SwiftSSH uses Face ID to protect your SSH connections and keys.
        NSLocalNetworkUsageDescription: SwiftSSH connects to SSH servers on your local network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: mssh/mssh.entitlements
      properties: {}

  SwiftSSHTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - SwiftSSHTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.swiftssh.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SwiftSSH

  SwiftSSHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - SwiftSSHUITests
      - path: SwiftSSHTests/Fixtures
        optional: true
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.swiftssh.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: SwiftSSH

schemes:
  SwiftSSH:
    build:
      targets:
        SwiftSSH: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SwiftSSHTests
        - SwiftSSHUITests
